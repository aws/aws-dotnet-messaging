version: 0.2

# Run the integration tests against real AWS resources. The default mode (unset)
# runs them against the in-memory LocalSqsSnsMessaging backend instead, which is
# covered by a separate credential-free job in the GitHub Actions workflow.
env:
  variables:
    AWS_MESSAGING_TEST_MODE: aws

phases:
  install:
    runtime-versions:
      dotnet: 8.x

  build:
    commands:
      - dotnet build AWS.Messaging.sln -c Release
      - dotnet test AWS.Messaging.sln -c Release --no-build --logger trx --results-directory ./testresults
reports:
    aws-dotnet-messaging-tests:
        file-format: VisualStudioTrx
        files:
            - '**/*'
        base-directory: './testresults'